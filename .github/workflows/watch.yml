name: watch

on:
  schedule:
    - cron: "*/5 * * * *" # fallback only: GitHub fires this every few hours; trigger/ dispatches every 5 min
  workflow_dispatch:
    inputs:
      preview:
        description: "ส่งตัวอย่างข้อความแต่ละแบบไป Discord (ไม่แตะ state)"
        type: boolean
        default: false

permissions:
  contents: write # commit state.json only
  actions: read # count this workflow's runs for the daily summary

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # every source down at once: 3 tries x 30 s timeout each, plus backoff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the branch tip when the job starts, not the commit when it was queued: a run that waited
          # behind another must see the state.json that run just pushed, or it re-sends those alerts
          ref: main

      - run: python3 watch.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}

      - name: Save state
        if: always() # keep what was already sent even if the run crashed later
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "state: $(date -u +%FT%TZ)"
          git pull -q --rebase && git push -q

      # Runs every 5 minutes, so announce only the change: the first failed run and the first good one after
      # shortcut: inspect 100 completed runs; use saved health state if cancellations can fill that window.
      - name: Tell Discord the watcher broke
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prev=$(gh run list -w watch.yml -s completed -L 100 --json conclusion -q 'map(select(.conclusion == "success" or .conclusion == "failure"))[0].conclusion // ""' || true)
          [ "$prev" = failure ] && exit 0
          curl -fsS -H "Content-Type: application/json" -A "DiscordBot (security-alert, 1)" "$DISCORD_WEBHOOK" -d '{
            "allowed_mentions": {"parse": []},
            "embeds": [{"title": "ตัวเฝ้าข่าวช่องโหว่ทำงานล้มเหลว", "url": "'"$RUN"'", "color": 16762173,
                        "description": "รอบนี้ไม่ได้ส่งข่าว\nกดหัวข้อเพื่อดู log บน GitHub Actions\nจะแจ้งอีกครั้งเมื่อกลับมาทำงานปกติ"}]}'

      - name: Tell Discord the watcher recovered
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list -w watch.yml -s completed -L 100 --json conclusion -q 'map(select(.conclusion == "success" or .conclusion == "failure"))[0].conclusion // ""' || true)
          [ "$prev" = failure ] || exit 0
          curl -fsS -H "Content-Type: application/json" -A "DiscordBot (security-alert, 1)" "$DISCORD_WEBHOOK" -d '{
            "allowed_mentions": {"parse": []},
            "embeds": [{"title": "ตัวเฝ้าข่าวช่องโหว่กลับมาทำงานปกติแล้ว", "color": 3187820}]}'
